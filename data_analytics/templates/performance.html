<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Performance Evaluation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/performance.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>System Performance Evaluation</h1>
            
            <div class="nav-links">
                <a href="/">Temperature Dashboard</a> | 
                <a href="/performance">Performance Metrics</a>
            </div>
        </div>
        
        <!-- Forecast Accuracy Section -->
        <div class="card">
            <div class="card-header">
                Forecast Accuracy
            </div>
            <div class="card-body">
                <div class="metrics-container">
                    <div class="metric-card">
                        <div class="metric-label">Time Horizon</div>
                        <select id="forecast-horizon" onchange="updateMetricsDisplay()">
                            <option value="1min">1 Minute</option>
                            <option value="10min">10 Minutes</option>
                            <option value="20min">20 Minutes</option>
                            <option value="30min">30 Minutes</option>
                        </select>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">MAE (Mean Absolute Error)</div>
                        <div class="metric-value" id="mae-value">--</div>
                        <div class="metric-label">°C</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">MSE (Mean Squared Error)</div>
                        <div class="metric-value" id="mse-value">--</div>
                        <div class="metric-label">°C</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">RMSE (Root Mean Squared Error)</div>
                        <div class="metric-value" id="rmse-value">--</div>
                        <div class="metric-label">°C</div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <canvas id="forecastAccuracyChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Latency Section -->
        <div class="card">
            <div class="card-header">
                Data Acquisition Latency
            </div>
            <div class="card-body">
                <div class="metrics-container">
                    <div class="metric-card">
                        <div class="metric-label">Average Latency</div>
                        <div class="metric-value" id="avg-latency-value">--</div>
                        <div class="metric-label">ms</div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <canvas id="latencyChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
